name: GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'docs/**'
      - 'packages/roku-dev-studio-mcp/src/tools.ts'
      - 'packages/roku-dev-studio-api/lib/operations.ts'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24.17.0'
          cache: 'npm'

      - run: npm ci

      # roku-dev-studio-api's own prepare is CI-guarded (like mcp's and the app's — see
      # release.yml's build job), so `npm ci` alone leaves its dist/ un-built in a fresh runner.
      # gen-docs.mjs bundles tools.ts, which requires roku-dev-studio-api/lib/operations — resolved
      # via that package's "exports" map to dist/lib/operations.js — so it must exist first.
      - name: Build roku-dev-studio-api (its CI-guarded prepare did not run)
        run: npm run build -w roku-dev-studio-api

      # Regenerates docs/mcp-tools.json from packages/roku-dev-studio-mcp/src/tools.ts right
      # before the Pages upload, so the deployed page can never lag behind the real tool catalog
      # — see packages/roku-dev-studio-mcp/scripts/gen-docs.mjs.
      - name: Generate MCP tool reference data
        run: npm run docs --workspace=roku-dev-studio-mcp

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

      - name: Display Pages URL
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          echo "Your GitHub Pages site will be available at:"
          echo "https://${{ github.repository_owner }}.github.io/$REPO_NAME"
          echo ""
          echo "Note: The URL is based on your repository name on GitHub."
          echo "Current repository: ${{ github.repository }}"
          echo "If you want a different URL, rename your repository on GitHub."
