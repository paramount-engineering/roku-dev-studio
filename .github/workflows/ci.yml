name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# A new push to the same PR/branch supersedes any in-flight CI run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Why every job uses `npm ci --ignore-scripts` + `npm rebuild` + an explicit
# topological workspace-build step:
#
# Several workspace packages (roku-dev-studio-api, -mcp, -remote-server, and
# the desktop app) have `prepare` scripts that build dist/ via esbuild. The
# desktop app's prepare bundles preload.ts, which require()s files from
# packages/roku-dev-studio-api/dist/lib/*.js. npm does NOT guarantee
# topological ordering of workspace `prepare` during `npm ci`, so on a fresh
# checkout the app's prepare can race ahead of the api's prepare and fail
# with "Could not resolve '../../packages/roku-dev-studio-api/dist/lib/...'".
# Skipping lifecycle scripts on install, restoring native postinstalls via
# `npm rebuild`, and running workspace builds explicitly in dep order makes
# the pipeline deterministic.

jobs:
  typecheck:
    name: TypeScript (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm rebuild
      - name: Build workspace packages (topological)
        run: |
          npm run build -w roku-dev-studio-api
          npm run build -w roku-dev-studio-mcp
          npm run build -w roku-dev-studio-remote-server
      - run: npm run typecheck

  api-package:
    name: API package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm rebuild
      - name: Build API package
        run: npm run build -w roku-dev-studio-api
      - run: npm run ci:api

  remote-server:
    name: Remote server syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm rebuild
      - name: Build workspace packages (topological)
        run: |
          npm run build -w roku-dev-studio-api
          npm run build -w roku-dev-studio-remote-server
      - run: npm run ci:remote-check

  electron-app:
    name: Electron main syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm rebuild
      - name: Build workspace packages (topological)
        run: |
          npm run build -w roku-dev-studio-api
          npm run build -w roku-dev-studio-mcp
          npm run build -w roku-dev-studio-remote-server
      - run: npm run ci:app-check
