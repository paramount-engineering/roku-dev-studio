name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# A new push to the same PR/branch supersedes any in-flight CI run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Determinism note for CI:
#
# Every workspace `prepare` script in this monorepo no-ops when CI=true
# (GitHub Actions sets this automatically). Without the guard, cross-workspace
# `prepare` scripts race during `npm ci` because npm doesn't topologically
# order them, and the desktop app's preload bundling depends on
# roku-dev-studio-api/dist/lib/*.js. Each job below installs deps with
# `npm ci`, then explicitly builds the workspace packages it needs in
# dependency order. (`--ignore-scripts` does NOT help here: in npm 10+ it
# does not skip workspace `prepare` — see npm/cli#5856.)

jobs:
  typecheck:
    name: TypeScript (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build workspace packages (topological order)
        run: |
          npm run build -w roku-dev-studio-api
          npm run build -w roku-dev-studio-mcp
          npm run build -w roku-dev-studio-remote-server
      - run: npm run typecheck

  api-package:
    name: API package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build API package
        run: npm run build -w roku-dev-studio-api
      - run: npm run ci:api

  remote-server:
    name: Remote server syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build workspace packages (topological order)
        run: |
          npm run build -w roku-dev-studio-api
          npm run build -w roku-dev-studio-remote-server
      - run: npm run ci:remote-check

  electron-app:
    name: Electron main syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build workspace packages (topological order)
        run: |
          npm run build -w roku-dev-studio-api
          npm run build -w roku-dev-studio-mcp
          npm run build -w roku-dev-studio-remote-server
      - run: npm run ci:app-check
