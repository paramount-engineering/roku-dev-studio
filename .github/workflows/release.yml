name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.
      - '[0-9]*' # Triggers on version tags like 1.0.0, 2.1.3, etc.
  workflow_dispatch:  # Allows manual trigger from GitHub UI
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  # ============================================
  # Build for macOS
  # ============================================
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Skip workspace prepare scripts: the app's prepare bundles preload.ts,
        # which require()s packages/roku-dev-studio-api/dist/lib/*.js that don't
        # exist until the api package is built. We build api explicitly below.
        run: npm ci --ignore-scripts

      - name: Build API package (needed by app's preload bundler)
        run: npm --prefix packages/roku-dev-studio-api run build

      - name: Build app bundles (main/preload/etc.)
        # npm's `prebuild` hook only fires for `npm run build`, not `npm run build:mac`,
        # so the bundle step must be invoked explicitly here. Without it,
        # electron-builder packs an app.asar with no main.bundled.cjs.
        run: npm --prefix apps/roku-dev-studio run build:preload

      - name: Build macOS app
        # No GH_TOKEN here — publishing to GitHub Releases happens in the
        # `release` job via softprops/action-gh-release, not here. Without
        # GH_TOKEN, electron-builder cannot publish even if it tried to.
        run: npm run build:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: mac-builds
          path: |
            apps/roku-dev-studio/dist/mac/**/*.dmg
            apps/roku-dev-studio/dist/*.dmg
          retention-days: 5

  # ============================================
  # Build for Windows
  # ============================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build API package (needed by app's preload bundler)
        run: npm --prefix packages/roku-dev-studio-api run build

      - name: Build app bundles (main/preload/etc.)
        run: npm --prefix apps/roku-dev-studio run build:preload

      - name: Build Windows app
        run: npm run build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: windows-builds
          # The afterAllArtifactBuild hook in apps/roku-dev-studio/scripts/build-hooks.ts
          # renames `dist/win/` → `dist/windows/` and relocates .exe files into
          # `dist/windows/<arch>/`. The recursive glob covers both the post-hook
          # canonical layout and any pre-hook fallback location.
          path: |
            apps/roku-dev-studio/dist/windows/**/*.exe
            apps/roku-dev-studio/dist/win/**/*.exe
            apps/roku-dev-studio/dist/*.exe
          retention-days: 5

  # ============================================
  # Build for Linux
  # ============================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build API package (needed by app's preload bundler)
        run: npm --prefix packages/roku-dev-studio-api run build

      - name: Build app bundles (main/preload/etc.)
        run: npm --prefix apps/roku-dev-studio run build:preload

      - name: Build Linux app
        run: npm run build:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: linux-builds
          path: |
            apps/roku-dev-studio/dist/linux/**/*.deb
            apps/roku-dev-studio/dist/linux/**/*.AppImage
            apps/roku-dev-studio/dist/*.deb
            apps/roku-dev-studio/dist/*.AppImage
          retention-days: 5

  # ============================================
  # Create GitHub Release
  # ============================================
  release:
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: mac-builds
          path: ./artifacts/mac

      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: windows-builds
          path: ./artifacts/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: linux-builds
          path: ./artifacts/linux

      - name: Display downloaded files
        run: |
          echo "=== macOS builds ==="
          find ./artifacts/mac -type f -name "*.dmg" -exec ls -lh {} \; || echo "No mac artifacts"
          echo ""
          echo "=== Windows builds ==="
          find ./artifacts/windows -type f -name "*.exe" -exec ls -lh {} \; || echo "No windows artifacts"
          echo ""
          echo "=== Linux builds ==="
          find ./artifacts/linux -type f \( -name "*.deb" -o -name "*.AppImage" \) -exec ls -lh {} \; || echo "No linux artifacts"

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "TAG_NAME=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: Roku Dev Studio v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Roku Dev Studio v${{ steps.get_version.outputs.VERSION }}
            
            ### Downloads
            
            | Platform | Intel/x64 | ARM64/Apple Silicon |
            |----------|-----------|----------------------|
            | **macOS** | Roku Dev Studio-${{ steps.get_version.outputs.VERSION }}.dmg | Roku Dev Studio-${{ steps.get_version.outputs.VERSION }}-arm64.dmg |
            | **Windows** | Roku Dev Studio Setup ${{ steps.get_version.outputs.VERSION }}.exe, Roku Dev Studio ${{ steps.get_version.outputs.VERSION }}.exe (portable) | - |
            | **Linux** | roku-dev-studio_${{ steps.get_version.outputs.VERSION }}_amd64.deb, Roku Dev Studio-${{ steps.get_version.outputs.VERSION }}-x86_64.AppImage | roku-dev-studio_${{ steps.get_version.outputs.VERSION }}_arm64.deb, Roku Dev Studio-${{ steps.get_version.outputs.VERSION }}-arm64.AppImage |
            
            ### What's New
            - See commit history for changes
            
            ### Installation
            
            **macOS**
            1. Download the appropriate `.dmg` file for your Mac
            2. Open the disk image
            3. Drag the app to your Applications folder
            4. **IMPORTANT - Before first launch:**
              - Use Terminal: `xattr -cr "/Applications/Roku Dev Studio.app"`
              - Then open the app.
            
            **Note for macOS:** The app is not code-signed. macOS Gatekeeper will block it. The command above removes quarantine attributes.
            
            **Windows**
            1. Download the Setup `.exe` file
            2. Run the installer
            3. If you see "Windows protected your PC":
              - Click "More info"
              - Click "Run anyway"
            4. Follow the installation wizard
            
            **Note for Windows:** The app is not code-signed. Windows SmartScreen will show a warning initially.
            
            **Linux**
            - **Debian/Ubuntu:** Download the `.deb` file and install with `sudo dpkg -i filename.deb`
            - **Other distros:** Download the `.AppImage` file, make it executable (`chmod +x filename.AppImage`), and run it
          draft: false
          prerelease: false
          files: |
            ./artifacts/mac/**/*.dmg
            ./artifacts/windows/**/*.exe
            ./artifacts/linux/**/*.deb
            ./artifacts/linux/**/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

