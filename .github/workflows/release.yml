name: Build and Release

on:
  push:
    tags:
      # Both prefixed (v1.2.3) and un-prefixed (1.2.3) semver tags trigger a release.
      # Pre-release suffixes (-rc.1, -beta.2, etc.) are accepted on either form.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

# A re-pushed tag (or repeat dispatch) cancels the in-flight run instead of
# stacking another full mac/win/linux build on top.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Build all three platforms via a matrix.
  #
  # Why --ignore-scripts on `npm ci`:
  # Several workspace packages (roku-dev-studio-api, -mcp, -remote-server,
  # and the app itself) have `prepare` scripts that build dist/ via esbuild.
  # `apps/roku-dev-studio`'s prepare bundles `preload.ts` which require()s
  # files from `packages/roku-dev-studio-api/dist/lib/*.js`. npm does NOT
  # guarantee topological ordering for workspace `prepare` scripts during
  # `npm ci`, so on a fresh CI checkout the app's prepare can race ahead of
  # the api's prepare and fail with:
  #   "Could not resolve '../../packages/roku-dev-studio-api/dist/lib/...'"
  # We sidestep the race entirely: install without lifecycle scripts,
  # `npm rebuild` to restore native postinstalls (electron, sharp, esbuild
  # platform binaries), then explicitly build workspace packages in
  # dependency order before invoking electron-builder.
  # ============================================================
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-latest
            build-cmd: build:mac
            artifact-name: mac-builds
            artifact-paths: |
              apps/roku-dev-studio/dist/*.dmg
              apps/roku-dev-studio/dist/mac/**/*.dmg
            electron-cache: ~/Library/Caches/electron
            builder-cache: ~/Library/Caches/electron-builder
          - label: Windows
            os: windows-latest
            build-cmd: build:win
            artifact-name: windows-builds
            artifact-paths: |
              apps/roku-dev-studio/dist/*.exe
              apps/roku-dev-studio/dist/win/**/*.exe
            electron-cache: ~/AppData/Local/electron/Cache
            builder-cache: ~/AppData/Local/electron-builder/Cache
          - label: Linux
            os: ubuntu-latest
            build-cmd: build:linux
            artifact-name: linux-builds
            artifact-paths: |
              apps/roku-dev-studio/dist/*.deb
              apps/roku-dev-studio/dist/*.AppImage
              apps/roku-dev-studio/dist/linux/**/*.deb
              apps/roku-dev-studio/dist/linux/**/*.AppImage
            electron-cache: ~/.cache/electron
            builder-cache: ~/.cache/electron-builder
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'

      # Cache the prebuilt electron + electron-builder downloads (~150 MB per
      # platform). Keyed on lockfile + the desktop app's package.json so any
      # change to the electron version invalidates correctly.
      - name: Cache Electron downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ${{ matrix.electron-cache }}
            ${{ matrix.builder-cache }}
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json', 'apps/roku-dev-studio/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Rebuild native modules
        # Re-runs install/postinstall lifecycle for native deps (electron,
        # sharp, esbuild platform binaries). Does NOT run `prepare`, so the
        # workspace prepare-ordering race we avoided above stays avoided.
        run: npm rebuild

      - name: Build workspace packages (topological)
        # api -> mcp/remote-server (both depend on api) -> app preload bundling
        # consumes api/dist/lib/*.js and so requires api to be built first.
        run: |
          npm run build -w roku-dev-studio-api
          npm run build -w roku-dev-studio-mcp
          npm run build -w roku-dev-studio-remote-server

      - name: Build desktop app
        # NOTE: do NOT pass `-- --publish never`. Root's "build:mac" calls
        # `npm --prefix apps/roku-dev-studio run build:mac`, and the inner
        # npm strips the `--publish` flag (it doesn't recognize it as a
        # forwarded arg without `--`), leaving a stray `never` that
        # electron-builder reads as a target name → "Unknown target: never".
        # Publishing is handled by the `release` job below via
        # softprops/action-gh-release, not by electron-builder, so no
        # publish flag is needed.
        run: npm run ${{ matrix.build-cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-paths }}
          if-no-files-found: error
          retention-days: 5

  # ============================================================
  # Aggregate all artifacts into a single GitHub Release.
  # ============================================================
  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          # No `name:` -> downloads every artifact this run produced into
          # ./artifacts/<artifact-name>/...
          path: ./artifacts

      - name: List downloaded artifacts
        run: |
          echo "::group::macOS builds"
          find ./artifacts/mac-builds -type f -name "*.dmg" 2>/dev/null -exec ls -lh {} \; || echo "(none)"
          echo "::endgroup::"
          echo "::group::Windows builds"
          find ./artifacts/windows-builds -type f -name "*.exe" 2>/dev/null -exec ls -lh {} \; || echo "(none)"
          echo "::endgroup::"
          echo "::group::Linux builds"
          find ./artifacts/linux-builds -type f \( -name "*.deb" -o -name "*.AppImage" \) 2>/dev/null -exec ls -lh {} \; || echo "(none)"
          echo "::endgroup::"

      - name: Resolve version + tag from event
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            # Manual dispatch always materializes as a v-prefixed tag.
            TAG_NAME="v${VERSION#v}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            # Strip an optional leading 'v' so VERSION is bare semver
            # (it appears in artifact filenames in the release body).
            VERSION="${TAG_NAME#v}"
          fi
          echo "VERSION=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: Roku Dev Studio v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Roku Dev Studio v${{ steps.get_version.outputs.VERSION }}

            ### Downloads

            | Platform | Intel/x64 | ARM64/Apple Silicon |
            |----------|-----------|----------------------|
            | **macOS** | Roku Dev Studio-${{ steps.get_version.outputs.VERSION }}.dmg | Roku Dev Studio-${{ steps.get_version.outputs.VERSION }}-arm64.dmg |
            | **Windows** | Roku Dev Studio Setup ${{ steps.get_version.outputs.VERSION }}.exe, Roku Dev Studio ${{ steps.get_version.outputs.VERSION }}.exe (portable) | - |
            | **Linux** | roku-dev-studio_${{ steps.get_version.outputs.VERSION }}_amd64.deb, Roku Dev Studio-${{ steps.get_version.outputs.VERSION }}-x86_64.AppImage | roku-dev-studio_${{ steps.get_version.outputs.VERSION }}_arm64.deb, Roku Dev Studio-${{ steps.get_version.outputs.VERSION }}-arm64.AppImage |

            ### What's New
            - See commit history for changes

            ### Installation

            **macOS**
            1. Download the appropriate `.dmg` file for your Mac
            2. Open the disk image
            3. Drag the app to your Applications folder
            4. **IMPORTANT - Before first launch:**
              - Use Terminal: `xattr -cr "/Applications/Roku Dev Studio.app"`
              - Then open the app.

            **Note for macOS:** The app is not code-signed. macOS Gatekeeper will block it. The command above removes quarantine attributes.

            **Windows**
            1. Download the Setup `.exe` file
            2. Run the installer
            3. If you see "Windows protected your PC":
              - Click "More info"
              - Click "Run anyway"
            4. Follow the installation wizard

            **Note for Windows:** The app is not code-signed. Windows SmartScreen will show a warning initially.

            **Linux**
            - **Debian/Ubuntu:** Download the `.deb` file and install with `sudo dpkg -i filename.deb`
            - **Other distros:** Download the `.AppImage` file, make it executable (`chmod +x filename.AppImage`), and run it
          draft: false
          prerelease: false
          files: |
            ./artifacts/mac-builds/**/*.dmg
            ./artifacts/windows-builds/**/*.exe
            ./artifacts/linux-builds/**/*.deb
            ./artifacts/linux-builds/**/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
