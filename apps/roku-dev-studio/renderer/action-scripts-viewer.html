  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: http: https:;" />
  <title data-i18n="actionScripts.viewerHeading">View and Manage Action Scripts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <!-- Full inline app stylesheet, auto-extracted from index.html's <style> at build time. -->
  <link rel="stylesheet" href="./dist/action-scripts-viewer.css" />
  <style>
    /* Window chrome only — the builder + theme styles come from the linked app stylesheet. */
    html, body { margin: 0; height: 100%; }
    .as-viewer-page { display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: var(--bg-primary); color: var(--text-primary); font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .as-viewer-toolbar { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-secondary); flex: 0 0 auto; }
    /* Centered dropdown group: label + saved-scripts select + Delete on one centered row. */
    .as-viewer-toolbar-row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .as-viewer-select-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
    .as-viewer-select { min-width: 260px; max-width: 440px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-tertiary); color: var(--text-primary); font-family: inherit; font-size: 13px; cursor: pointer; }
    .as-viewer-select:focus { outline: none; border-color: var(--accent-purple); }
    .as-viewer-no-device-note { margin: 0; font-size: 11px; color: var(--text-muted); text-align: center; }
    .as-viewer-main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    /* Give the replicated builder subtree the same flex context it has inside a device card. */
    .as-viewer-main .action-scripts-card-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; padding: 12px; }
    .as-viewer-main .action-scripts-builder-content { flex: 1 1 auto; min-height: 0; }
    /* Apply/Copy/Save moved into the JSON panel header; let them wrap rather than overflow-clip when the panel is narrow. */
    .as-viewer-main .action-scripts-builder-output-header { flex-wrap: wrap; row-gap: 6px; }
    .as-viewer-output-actions { flex-wrap: wrap; justify-content: flex-end; row-gap: 6px; }
  </style>
</head>

                        <button type="button" class="btn btn-icon btn-secondary builder-undo-btn" title="Undo (Ctrl+Z)" data-i18n-title="app.undoTitle" disabled><svg width="14" height="14"><use href="#icon-undo"/></svg></button>

                          </div>
                        </div>
                        <div class="action-scripts-builder-step-fields-container">
                          <label data-i18n="app.actionType">Action Type</label>
                          <select class="action-scripts-builder-type-select action-scripts-select"></select>
                        </div>
                        <div class="action-scripts-builder-step-fields"></div>
                        <div class="action-scripts-builder-add-step-wrap">
                          <span class="builder-add-step-label-spacer" aria-hidden="true">Action Type</span>
                          <button type="button" class="btn btn-primary action-scripts-builder-add-step" data-i18n="app.addAction">Add Action</button>
                          <button type="button" class="btn btn-secondary action-scripts-builder-cancel-edit" style="display: none;" data-i18n="common.cancel">Cancel</button>

                      </div>
