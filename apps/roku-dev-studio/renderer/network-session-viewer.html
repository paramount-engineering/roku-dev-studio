<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; media-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self';" />
  <title data-i18n="networkSessionViewer.networkSession">Network Session</title>
  <!-- Generated at build time from index.html's inline <style> so the ni-* + theme rules match the
       live Network Inspector exactly. See scripts/build/transpile-renderer.ts. -->
  <link rel="stylesheet" href="./dist/network-session-viewer.css" />
  <style>
    /* Standalone window — the card fills the frame edge-to-edge (no wasted gutter, no rounded card). */
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    .nsv-root { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
    .nsv-root .network-inspector-card { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; border: none; border-radius: 0; margin: 0; }
    .nsv-root .ni-detail-workspace { flex: 1 1 auto; min-height: 0; }
    .nsv-notice { padding: 6px 12px; font-size: 12px; color: var(--text-secondary, #aaa); }
    /* Single header row: the filter is an IN-FLOW, drag-resizable field — NOT the live tab's absolutely
       centered slot, which wraps to a second row when the title/side groups leave no centered room.
       An in-flow flex item can't wrap to another row. Width is driven by --nsv-filter-w (drag handle). */
    .nsv-root .ni-card-header { flex-wrap: nowrap; }
    .nsv-root .ni-header-center {
      position: static;
      transform: none;
      left: auto;
      top: auto;
      width: auto;
      max-width: none;
      flex: 0 1 var(--nsv-filter-w, 380px);
      min-width: 240px;
      pointer-events: auto;
      gap: 8px;
    }
    .nsv-root .nsv-filter-resize {
      flex: 0 0 auto;
      align-self: stretch;
      width: 10px;
      margin-left: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: col-resize;
      background: transparent;
    }
    .nsv-root .nsv-filter-resize::before {
      content: "";
      width: 2px;
      height: 16px;
      border-radius: 2px;
      background: var(--border-hover);
    }
    .nsv-root .nsv-filter-resize:hover::before,
    .nsv-root .nsv-filter-resize.is-dragging::before { background: var(--accent-purple); }
  </style>
</head>
<body>
  <!-- Icon sprite (subset of index.html's, for the ni-* controls this window uses). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="icon-wrap-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="6" x2="20" y2="6"/><path d="M4 12h13a3.5 3.5 0 0 1 0 7h-6"/><polyline points="14 16 11 19 14 22"/><line x1="4" y1="18" x2="9" y2="18"/>
      </symbol>
      <symbol id="icon-network" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.4"/><ellipse cx="12" cy="12" rx="1.4" ry="3.4"/><path d="M8.6 12h6.8"/>
        <circle cx="20" cy="12" r="1.5"/><circle cx="4" cy="12" r="1.5"/>
        <circle cx="16" cy="5.1" r="1.5"/><circle cx="8" cy="5.1" r="1.5"/>
        <circle cx="16" cy="18.9" r="1.5"/><circle cx="8" cy="18.9" r="1.5"/>
        <path d="M15.9 12h2.1"/><path d="M6 12h2.1"/>
        <path d="M14 8.5 15 6.9"/><path d="M10 8.5 9 6.9"/>
        <path d="M14 15.5 15 17.1"/><path d="M10 15.5 9 17.1"/>
      </symbol>
      <symbol id="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
      </symbol>
      <symbol id="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>
      </symbol>
      <symbol id="icon-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m6 9 6 6 6-6"/>
      </symbol>
      <symbol id="icon-chevron-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m18 15-6-6-6 6"/>
      </symbol>
      <symbol id="icon-zoom" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </symbol>
      <symbol id="icon-terminal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/>
      </symbol>
      <symbol id="icon-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
      </symbol>
      <symbol id="icon-layout-rows" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="7" rx="1"/><rect x="3" y="13" width="18" height="7" rx="1"/>
      </symbol>
      <symbol id="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
      </symbol>
      <symbol id="icon-file-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" x2="8" y1="13" y2="13"/>
        <line x1="16" x2="8" y1="17" y2="17"/>
        <line x1="10" x2="8" y1="9" y2="9"/>
      </symbol>
    </defs>
  </svg>

  <div class="nsv-root">
    <div class="network-inspector-container" style="display:flex; flex-direction:column; flex:1; min-height:0;">
      <div class="card network-inspector-card">
        <div class="card-header ni-card-header">
          <div class="ni-header-start">
            <span class="card-icon"><span class="icon icon-sm"><svg><use href="#icon-network"/></svg></span></span>
            <span class="card-title" data-i18n="networkSessionViewer.networkSession">Network Session</span>
            <div class="ni-header-tools">
              <div class="ni-find-btn-group">
                <button type="button" class="btn btn-secondary btn-sm ni-icon-btn ni-find-btn" data-ni-find title="Find in Traffic — URL, Payloads, Headers, Response Bodies (⌘/Ctrl+F)" aria-label="Find in Traffic" data-i18n-title="networkSessionViewer.findBtnTitle" data-i18n-aria-label="networkSessionViewer.findBtnAria">
                  <span class="icon icon-sm"><svg><use href="#icon-zoom"/></svg></span>
                </button>
                <button type="button" class="ni-find-sub-btn" data-ni-find-prev title="Previous Match (Shift+↑)" aria-label="Previous Match" data-i18n-title="networkSessionViewer.findPrevTitle" data-i18n-aria-label="networkSessionViewer.findPrevAria">
                  <span class="icon icon-xs"><svg><use href="#icon-chevron-up"/></svg></span>
                </button>
                <button type="button" class="ni-find-sub-btn" data-ni-find-next title="Next Match (Shift+↓)" aria-label="Next Match" data-i18n-title="networkSessionViewer.findNextTitle" data-i18n-aria-label="networkSessionViewer.findNextAria">
                  <span class="icon icon-xs"><svg><use href="#icon-chevron-down"/></svg></span>
                </button>
                <button type="button" class="ni-find-sub-btn ni-find-clear-btn" data-ni-find-clear title="Clear Find results" aria-label="Clear Find results" data-i18n-title="networkSessionViewer.findClear" data-i18n-aria-label="networkSessionViewer.findClear">
                  <span class="icon icon-xs"><svg><use href="#icon-x"/></svg></span>
                </button>
              </div>
            </div>
          </div>
          <div class="ni-header-center">
            <div class="ni-filter-wrap">
              <input type="text" class="ni-filter-input" data-ni-filter placeholder="Filter Traffic…" title="Filter Traffic — click the info icon for supported syntax." data-i18n-placeholder="networkSessionViewer.filterPlaceholder" data-i18n-title="networkSessionViewer.filterTitle" />
              <button type="button" class="ni-filter-clear" data-ni-filter-clear title="Clear filter" aria-label="Clear filter" data-i18n-title="networkSessionViewer.clearFilter" data-i18n-aria-label="networkSessionViewer.clearFilter" hidden>
                <span class="icon icon-xs"><svg><use href="#icon-x"/></svg></span>
              </button>
              <button type="button" class="ni-filter-help" data-ni-filter-help title="Filtering Help &amp; Supported Syntax" aria-label="Filtering help" data-i18n-title="networkSessionViewer.filterHelpTitle" data-i18n-aria-label="networkSessionViewer.filterHelpAria">
                <span class="icon icon-xs"><svg><use href="#icon-info"/></svg></span>
              </button>
            </div>
            <div class="nsv-filter-resize" data-nsv-filter-resize role="separator" aria-orientation="vertical" title="Drag to resize the filter (double-click to reset)" data-i18n-title="networkSessionViewer.filterResizeTitle"></div>
            <span class="ni-session-count" data-ni-session-count>0</span>
          </div>
          <div class="ni-header-tools">
            <button type="button" class="btn btn-secondary btn-sm ni-icon-btn" data-ni-layout-toggle title="Stack Request and Response Vertically" aria-label="Toggle Detail Layout" aria-pressed="true" data-i18n-title="networkSessionViewer.layoutToggleTitle" data-i18n-aria-label="networkSessionViewer.layoutToggleAria">
              <span class="icon icon-sm"><svg><use href="#icon-layout-rows"/></svg></span>
            </button>
          </div>
        </div>

        <div class="nsv-notice" data-nsv-notice hidden></div>

        <div class="ni-detail-workspace" data-ni-workspace data-detail-layout="columns">
          <aside class="ni-sidebar" data-ni-session-pane data-view="sequence">
            <div class="ni-sidebar-head">
              <button type="button" class="ni-group-toggle" data-ni-toggle-all-groups tabindex="-1" aria-hidden="true" title="Collapse all groups" aria-label="Collapse all groups" data-i18n-title="networkSessionViewer.collapseGroups" data-i18n-aria-label="networkSessionViewer.collapseGroups">
                <span class="ni-struct-chevron" aria-hidden="true">▼</span>
              </button>
              <div class="ni-sidebar-options">
                <label class="ni-sidebar-option" title="Group Sessions by Hostname" data-i18n-title="networkSessionViewer.groupByHostTitle">
                  <span class="ni-sidebar-option-label" data-i18n="networkSessionViewer.groupByHost">Group by Host</span>
                  <input type="checkbox" data-ni-group-by-host />
                </label>
              </div>
            </div>
            <div class="ni-sidebar-list" data-ni-session-list>
              <div class="ni-session-empty" data-i18n="common.loading">Loading…</div>
            </div>
          </aside>
          <!-- Detail pane markup injected at runtime from network-detail-view.ts (DETAIL_PANE_HTML), shared with the live Network Inspector. -->
          <div class="ni-inspector-pane is-empty" data-ni-detail></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./dist/components/network-session-viewer/network-session-viewer.js"></script>
</body>
</html>
