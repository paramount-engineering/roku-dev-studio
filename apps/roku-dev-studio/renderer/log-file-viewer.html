<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logs</title>
  <link rel="stylesheet" href="log-file-viewer.css" />
</head>
<body class="log-file-viewer-page">
  <svg xmlns="http://www.w3.org/2000/svg" style="display: none" aria-hidden="true">
    <symbol id="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 6 6 18" />
      <path d="m6 6 12 12" />
    </symbol>
    <symbol id="icon-chevron-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m18 15-6-6-6 6" />
    </symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 9 6 6 6-6" />
    </symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
      <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
    </symbol>
    <symbol id="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" x2="12" y1="15" y2="3"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </symbol>
    <symbol id="icon-monitor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10.5" cy="10.5" r="8"/>
      <path d="m21 21-4.4-4.4"/>
      <path d="M4.6 10.5 Q10.5 5 16.4 10.5 Q10.5 16 4.6 10.5 Z"/>
      <circle cx="10.5" cy="10.5" r="2.3" fill="currentColor" stroke="none"/>
    </symbol>
  </svg>
  <header id="logViewerHeader" class="log-viewer-header">
    <div class="log-viewer-header-primary">
      <h1 id="logViewerTitle" class="log-viewer-title">Log file</h1>
      <p id="logViewerStatus" class="log-viewer-status"></p>
    </div>
    <!-- The `.telnet-find-bar` is injected at runtime from the shared `buildConsoleFindBarElement`
         (see log-file-viewer.ts), so this window and the Console panel share one markup source. -->
    <div id="logViewerFindHost" class="log-viewer-find-host" hidden></div>
    <div id="logViewerActions" class="log-viewer-actions" hidden>
      <button
        type="button"
        class="btn btn-secondary log-viewer-monitor-btn"
        title="Console Monitor — scan this file for recognized BrightScript issues"
        data-i18n="logFileViewer.monitorBtn"
        data-i18n-title="logFileViewer.monitorBtnTitle"
      >
        <span class="icon icon-md"><svg><use href="#icon-monitor" /></svg></span> Monitor
      </button>
      <button
        type="button"
        class="btn btn-secondary log-viewer-copy-btn"
        title="Copy filtered log content to clipboard"
        data-i18n="common.copy"
        data-i18n-title="logFileViewer.copyBtnTitle"
      >
        <span class="icon icon-xs"><svg><use href="#icon-copy" /></svg></span> Copy
      </button>
    </div>
  </header>
  <main class="log-viewer-main">
    <div class="telnet-output-container log-viewer-output-wrap">
      <div id="logViewerOutput" class="telnet-output"></div>
    </div>
  </main>
  <script type="module" src="./dist/components/log-file-viewer/log-file-viewer.js"></script>
</body>
</html>
