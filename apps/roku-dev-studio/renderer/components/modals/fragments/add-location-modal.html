  <!-- Add Remote Location Modal -->
  <div class="add-location-modal" id="addLocationModal">
    <div class="add-location-form">
      <h3 data-i18n="modals.addLocation.title">🌐 Add Remote Location</h3>
      <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 16px; line-height: 1.5;" data-i18n="modals.addLocation.intro">
        Connect to Roku devices at a remote location via the Roku Relay Server running on a Mac Mini or other computer.
      </p>
      <div class="form-group">
        <label for="locationName" data-i18n="modals.addLocation.nameLabel">Location Name</label>
        <input type="text" id="locationName" placeholder="e.g., Office Lab, Studio B" data-i18n-placeholder="modals.addLocation.namePlaceholder">
        <div class="form-hint" data-i18n="modals.addLocation.nameHint">A friendly name to identify this location</div>
      </div>
      <div class="form-group">
        <label for="locationHost" data-i18n="modals.addLocation.hostLabel">Server Address</label>
        <input type="text" id="locationHost" placeholder="192.168.1.50 or mac-mini.local" data-i18n-placeholder="modals.addLocation.hostPlaceholder">
        <div class="form-hint" data-i18n="modals.addLocation.hostHint">IP Address or Hostname of the Relay Server</div>
      </div>
      <div class="form-group">
        <label for="locationPort" data-i18n="modals.addLocation.portLabel">Port</label>
        <input type="number" id="locationPort" value="4951" placeholder="4951">
        <div class="form-hint" data-i18n="modals.addLocation.portHint">Default port is 4951</div>
      </div>
      <div class="form-actions">
        <button class="btn btn-secondary" id="cancelAddLocation" data-i18n="common.cancel">Cancel</button>
        <button class="btn btn-primary" id="confirmAddLocation" data-i18n="modals.addLocation.addBtn">Add Location</button>
      </div>
    </div>
  </div>
