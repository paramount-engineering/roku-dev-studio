<div class="modal-overlay deeplink-media-types-modal" id="deeplinkMediaTypesModal" aria-hidden="true">
  <div class="modal deeplink-media-types-modal-box">
    <div class="modal-header">
      <span class="modal-title" data-i18n="modals.deeplinkMediaTypes.title"><span class="icon icon-md"><svg><use href="#icon-link"/></svg></span> Manage Media Types</span>
      <button type="button" class="modal-close deeplink-media-types-modal-close" aria-label="Close" data-i18n-aria-label="common.close"><span class="icon icon-sm"><svg><use href="#icon-x"/></svg></span></button>
    </div>
    <div class="modal-body">
      <p class="deeplink-media-types-hint" data-i18n="modals.deeplinkMediaTypes.hint">
        Built-in media types are always available. Custom entries are saved globally and appear in every device tab.
      </p>

      <div class="deeplink-media-types-section">
        <h4 class="deeplink-media-types-section-title" data-i18n="modals.deeplinkMediaTypes.builtinTitle">Built-in</h4>
        <ul class="deeplink-media-types-builtin-list">
          <li><span class="deeplink-media-type-entry-label" data-i18n="modals.deeplinkMediaTypes.builtinMovie">Movie</span><span class="deeplink-media-type-entry-value">movie</span></li>
          <li><span class="deeplink-media-type-entry-label" data-i18n="modals.deeplinkMediaTypes.builtinSeries">Series</span><span class="deeplink-media-type-entry-value">series</span></li>
          <li><span class="deeplink-media-type-entry-label" data-i18n="modals.deeplinkMediaTypes.builtinEpisode">Episode</span><span class="deeplink-media-type-entry-value">episode</span></li>
          <li><span class="deeplink-media-type-entry-label" data-i18n="modals.deeplinkMediaTypes.builtinLive">Live</span><span class="deeplink-media-type-entry-value">live</span></li>
        </ul>
      </div>

      <div class="deeplink-media-types-section">
        <h4 class="deeplink-media-types-section-title" data-i18n="modals.deeplinkMediaTypes.customTitle">Custom</h4>
        <div id="deeplinkMediaTypesCustomList" class="deeplink-media-types-custom-list"></div>
      </div>

      <div class="deeplink-media-types-section deeplink-media-types-add-section">
        <h4 class="deeplink-media-types-section-title" data-i18n="modals.deeplinkMediaTypes.addTitle">Add Media Type</h4>
        <div class="deeplink-media-types-add-form">
          <label class="deeplink-media-type-add-field">
            <span class="deeplink-media-type-add-label" data-i18n="modals.deeplinkMediaTypes.displayNameLabel">Display Name</span>
            <input type="text" id="deeplinkMediaTypeLabel" placeholder="e.g., Short Film" data-i18n-placeholder="modals.deeplinkMediaTypes.displayNamePlaceholder" maxlength="64" />
          </label>
          <label class="deeplink-media-type-add-field">
            <span class="deeplink-media-type-add-label" data-i18n="modals.deeplinkMediaTypes.ecpValueLabel">ECP Value</span>
            <input type="text" id="deeplinkMediaTypeValue" placeholder="e.g., short-film" data-i18n-placeholder="modals.deeplinkMediaTypes.ecpValuePlaceholder" maxlength="64" />
          </label>
          <button type="button" class="btn btn-primary" id="deeplinkMediaTypeAddBtn" data-i18n="common.add">Add</button>
        </div>
        <p id="deeplinkMediaTypesError" class="deeplink-media-types-error" hidden></p>
      </div>
    </div>
  </div>
</div>
