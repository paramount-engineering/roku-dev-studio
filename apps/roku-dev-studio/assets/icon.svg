<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background gradient with depth -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#252540"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    
    <!-- Inner shadow gradient for icon depth -->
    <linearGradient id="innerTopLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff" stop-opacity="0.08"/>
      <stop offset="30%" style="stop-color:#ffffff" stop-opacity="0"/>
    </linearGradient>
    
    <linearGradient id="innerBottomShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="70%" style="stop-color:#000000" stop-opacity="0"/>
      <stop offset="100%" style="stop-color:#000000" stop-opacity="0.3"/>
    </linearGradient>
    
    <!-- Text fill gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C084FC"/>
      <stop offset="50%" style="stop-color:#A855F7"/>
      <stop offset="100%" style="stop-color:#22D3D3"/>
    </linearGradient>
    
    <!-- Shadow color for extrusion -->
    <linearGradient id="shadowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1f54"/>
      <stop offset="100%" style="stop-color:#1a1030"/>
    </linearGradient>
    
    <!-- Outer glow for icon -->
    <filter id="iconOuterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#7C3AED" flood-opacity="0.4"/>
    </filter>
    
    <!-- Clean drop shadow for text depth -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="2" flood-color="#0a0614" flood-opacity="0.9"/>
    </filter>
    
    <!-- Soft glow for text -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer glow behind icon -->
  <rect x="60" y="60" width="904" height="904" rx="180" ry="180" fill="#7C3AED" filter="url(#iconOuterGlow)" opacity="0.5"/>
  
  <!-- Main icon background with rounded corners -->
  <rect x="50" y="50" width="924" height="924" rx="190" ry="190" fill="url(#bgGradient)"/>
  
  <!-- Icon inner depth - top highlight -->
  <rect x="50" y="50" width="924" height="924" rx="190" ry="190" fill="url(#innerTopLight)"/>
  
  <!-- Icon inner depth - bottom shadow -->
  <rect x="50" y="50" width="924" height="924" rx="190" ry="190" fill="url(#innerBottomShadow)"/>
  
  <!-- Icon border with depth -->
  <rect x="50" y="50" width="924" height="924" rx="190" ry="190" fill="none" stroke="#3d3d5c" stroke-width="3"/>
  <rect x="54" y="54" width="916" height="916" rx="186" ry="186" fill="none" stroke="#0a0a14" stroke-width="1" opacity="0.5"/>
  
  <!-- Single solid shadow layer for clean 3D effect -->
  <g>
    <text x="512" y="328" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" font-size="240" font-weight="900" fill="url(#shadowGradient)" text-anchor="middle" letter-spacing="-6" transform="translate(0, 16)">Roku</text>
    <text x="512" y="555" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" font-size="240" font-weight="900" fill="url(#shadowGradient)" text-anchor="middle" letter-spacing="-6" transform="translate(0, 16)">Dev</text>
    <text x="512" y="782" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" font-size="240" font-weight="900" fill="url(#shadowGradient)" text-anchor="middle" letter-spacing="-6" transform="translate(0, 16)">Studio</text>
  </g>
  
  <!-- Main text with gradient and glow -->
  <g filter="url(#textGlow)">
    <text x="512" y="328" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" font-size="240" font-weight="900" fill="url(#textGradient)" text-anchor="middle" letter-spacing="-6">Roku</text>
    <text x="512" y="555" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" font-size="240" font-weight="900" fill="url(#textGradient)" text-anchor="middle" letter-spacing="-6">Dev</text>
    <text x="512" y="782" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" font-size="240" font-weight="900" fill="url(#textGradient)" text-anchor="middle" letter-spacing="-6">Studio</text>
  </g>
</svg>
